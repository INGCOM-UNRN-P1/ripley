name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  full-suite:
    name: Suite completa (entorno docente)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get update && sudo apt-get install -y valgrind bubblewrap
          sudo chmod u+s /usr/bin/bwrap || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - run: |
          uv sync
          uv pip install "git+https://github.com/INGCOM-UNRN-P1/daedalus.git" "git+https://github.com/INGCOM-UNRN-P1/gaff.git" "git+https://github.com/INGCOM-UNRN-P1/nostromo.git" "git+https://github.com/INGCOM-UNRN-P1/kaneda.git"
      - run: uv run pytest -q


  student-minimal:
    name: Entorno estudiante mínimo (ripley-check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      # Simula la notebook del estudiante: solo gcc; sin valgrind, cppcheck,
      # qemu, bwrap ni frama-c. El toolchain de sistema sigue accesible vía
      # rutas absolutas internas, pero el PATH del proyecto queda restringido.
      - name: Construir PATH restringido
        run: |
          mkdir -p /tmp/studentbin
          ln -s "$(command -v gcc)" /tmp/studentbin/gcc || true
          echo "/tmp/studentbin" > "$GITHUB_PATH"
      - run: uv sync
      - name: Fronteras de capas y registro
        run: uv run pytest tests/unit/test_layer_boundaries.py tests/unit/test_registry.py -q
      - name: Flujo pack/run sin herramientas avanzadas
        run: uv run pytest tests/integration/test_ripkg_flow.py -q
      - name: Doctor reporta omisiones y nunca falla por faltar herramientas
        run: |
          OUT="$(uv run ripley-check doctor)"
          echo "$OUT"
          grep -qE "valgrind.*(falta|no )" <(echo "$OUT") || {
            echo "el doctor no refleja valgrind ausente"; exit 1; }
          grep -q "Omitidos\|falta" <(echo "$OUT") || {
            echo "el doctor no lista checks omitidos"; exit 1; }

  test-windows:
    name: Test Windows (MSYS2 UCRT64)
    runs-on: windows-2025
    # Los estudiantes usan Windows (entorno: MSYS2 UCRT64): la suite tiene que pasar también ahí
    # (N-ECO-10).
    env:
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v7

      - name: Instalar el toolchain de UCRT64 (el mismo del entorno de la cátedra)
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Exponer las herramientas de UCRT64 en el PATH
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Sincronizar dependencias
        # Los mismos satélites que instala el job de Linux: sin ellos, los tests de integración no
        # tienen compilador (daedalus) ni sandbox (nostromo).
        run: |
          uv sync
          uv pip install "git+https://github.com/INGCOM-UNRN-P1/daedalus.git" "git+https://github.com/INGCOM-UNRN-P1/gaff.git" "git+https://github.com/INGCOM-UNRN-P1/nostromo.git" "git+https://github.com/INGCOM-UNRN-P1/kaneda.git"

      - name: Diagnóstico del entorno
        run: uv run ripley doctor
        continue-on-error: true

      - name: Ejecutar suite de pruebas
        run: uv run pytest -q

  calidad:
    name: Errores de Python y dependencias vulnerables
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Instalar uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Solo reglas que indican errores reales: sintaxis (E9), comparaciones
      # inválidas (F63), sentencias fuera de lugar (F7) y nombres indefinidos (F82).
      - name: Errores de Python e imports sin usar (ruff E9, F63, F7, F82, F401)
        run: uvx ruff check --select E9,F63,F7,F82,F401 .

      - name: Dependencias con vulnerabilidades conocidas (pip-audit)
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project --all-extras --all-groups > "$RUNNER_TEMP/requisitos.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requisitos.txt" --disable-pip --no-deps
