[project]
name = "ripley"
version = "0.1.0"
description = "CLI tool for batch processing, grading, versioning and evaluating Moodle C submissions"
readme = "spec.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.3",
    "python-slugify>=8.0.4",
    "tomli-w>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[project.scripts]
ripley = "ripley.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ripley"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
