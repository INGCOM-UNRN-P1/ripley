[compiler]
enabled = true
executable = "gcc"
flags = [
    "-Wall",
    "-Wextra",
    "-pedantic",
    "-std=c11",
    "-fsanitize=address,undefined",
]

[limits]
timeout_segundos = 5
limite_memoria_mb = 128
max_tamano_ejecutable_mb = 10

[style]
enabled = true
brace_style = "allman"
require_braces = true
indent_style = "spaces"
indent_size = 4
spacing_operators = true
spacing_keywords = true
no_trailing_whitespace = true
max_blank_lines = 2

[p1_rules]
enabled = true

[linters]
enabled = true
dead_code = true
magic_numbers = true
internal_clones = true
naming = true
doxygen = true

[ast_auditors]
enabled = true
const_correctness = true
short_circuit = true
deep_free = true
string_null = true
variable_shadowing = true
dangling_stack_pointer = true
overengineering = true
evaluation_order = true
string_literal_write = true
backward_goto = true

[flowchart]
enabled = true
format = "mermaid"

[memory_visualizer]
enabled = true
format = "mermaid"

[callgraph]
enabled = true
format = "mermaid"
include_stdlib = false

[property_testing]
enabled = true
properties = ["idempotence", "commutativity", "sort_invariant"]

[pure_functions]
enabled = true
functions = []

[restrictions]
enabled = true
forbidden_constructs = ["goto"]
required_constructs = []

[doxygen]
enabled = true
require_brief = true
require_params = true
require_return = true

[valgrind]
enabled = true
tolerar_fugas_en_error = true
flags = [
    "--leak-check=full",
    "--show-leak-kinds=all",
    "--track-origins=yes",
    "--error-exitcode=1",
]

[cppcheck]
enabled = true
ejecutable = "cppcheck"
parametros = [
    "--enable=all",
    "--inline-suppr",
    "--suppress=missingIncludeSystem",
    "--suppress=staticFunction",
]
reglas_python = []

[rubric]
peso_compilacion = 0.25
peso_linter = 0.25
peso_estilo = 0.15
peso_pruebas = 0.35

[security]
enabled = true
forbidden_calls = [
    "system",
    "fork",
    "execv",
    "execvp",
    "execl",
    "execlp",
    "execle",
    "execve",
    "popen",
    "kill",
    "raise",
    "clone",
    "ptrace",
    "socket",
    "connect",
    "bind",
    "listen",
    "accept",
]
forbidden_headers = [
    "unistd.h",
    "sys/socket.h",
    "netinet/in.h",
    "arpa/inet.h",
    "sys/wait.h",
    "signal.h",
    "sys/ptrace.h",
]
